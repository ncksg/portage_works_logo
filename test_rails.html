<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rail Opacity Comparison</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; padding: 3rem; font-family: monospace; color: #666; }
    h1 { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #444; }
    .row { display: flex; gap: 3rem; flex-wrap: wrap; justify-content: center; }
    .test { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .test .label { font-size: 11px; letter-spacing: 0.12em; color: #666; }
    .test .sublabel { font-size: 10px; color: #444; }
    .box { width: 220px; height: 220px; background: #2E2E2A; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <h1>Rail Opacity Comparison (V1 Origin Dot)</h1>

  <div class="row">
    <!-- Current: 0.08 -->
    <div class="test">
      <span class="label">CURRENT</span>
      <span class="sublabel">fill-opacity: 0.08</span>
      <div class="box">
        <svg viewBox="0 0 64 64" width="170" height="170">
          <rect x="0" y="22" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.08"/>
          <rect x="0" y="36" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.08"/>
          <line x1="14" y1="52" x2="50" y2="12" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="12" r="4.5" fill="#C4522A"/>
          <circle cx="14" cy="52" r="4" fill="none" stroke="#E8E2D4" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <!-- One shade darker: 0.14 -->
    <div class="test">
      <span class="label">+1 SHADE</span>
      <span class="sublabel">fill-opacity: 0.14</span>
      <div class="box">
        <svg viewBox="0 0 64 64" width="170" height="170">
          <rect x="0" y="22" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
          <rect x="0" y="36" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
          <line x1="14" y1="52" x2="50" y2="12" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="12" r="4.5" fill="#C4522A"/>
          <circle cx="14" cy="52" r="4" fill="none" stroke="#E8E2D4" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <!-- Two shades darker: 0.20 -->
    <div class="test">
      <span class="label">+2 SHADES</span>
      <span class="sublabel">fill-opacity: 0.20</span>
      <div class="box">
        <svg viewBox="0 0 64 64" width="170" height="170">
          <rect x="0" y="22" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.20"/>
          <rect x="0" y="36" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.20"/>
          <line x1="14" y1="52" x2="50" y2="12" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="12" r="4.5" fill="#C4522A"/>
          <circle cx="14" cy="52" r="4" fill="none" stroke="#E8E2D4" stroke-width="1.5"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
