<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=DM+Serif+Display&amp;display=swap');
    </style>
  </defs>

  <!-- Mark: two rails crossed by diagonal, origin + destination dots -->
  <g transform="translate(0, 4) scale(0.75)">
    <!-- Route rails -->
    <rect x="0" y="22" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.08"/>
    <rect x="0" y="36" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.08"/>
    <!-- Diagonal path -->
    <line x1="14" y1="52" x2="50" y2="12" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
    <!-- Destination dot: rust -->
    <circle cx="50" cy="12" r="4.5" fill="#C4522A"/>
    <!-- Origin dot: muted -->
    <circle cx="14" cy="52" r="3" fill="#E8E2D4" fill-opacity="0.3"/>
  </g>

  <!-- Divider -->
  <line x1="68" y1="5" x2="68" y2="51" stroke="#464640" stroke-width="1"/>

  <!-- Wordmark -->
  <text
    x="88" y="37"
    font-family="'DM Serif Display', serif"
    font-size="38"
    fill="#E8E2D4">Portage</text>

  <!-- "WORKS" -->
  <text
    x="90" y="52"
    font-family="'IBM Plex Mono', monospace"
    font-size="11"
    letter-spacing="4.62"
    fill="#706A60">WORKS</text>
</svg>
