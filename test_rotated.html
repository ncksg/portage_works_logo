<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rotated Mark Comparison</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=DM+Serif+Display&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; padding: 3rem; font-family: monospace; color: #666; }
    h1 { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #444; }
    .section { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #444; }
    .row { display: flex; gap: 3rem; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
    .test { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .test .label { font-size: 11px; letter-spacing: 0.12em; color: #666; }
    .box { background: #2E2E2A; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .mark-box { width: 220px; height: 220px; }
    .logo-box { padding: 3rem 4rem; }
    .divider { width: 60%; max-width: 500px; height: 1px; background: #222; }
  </style>
</head>
<body>
  <h1>Mark Orientation Comparison</h1>

  <!-- MARK ONLY -->
  <span class="section">Mark only</span>
  <div class="row">
    <div class="test">
      <span class="label">CURRENT</span>
      <div class="box mark-box">
        <svg viewBox="0 0 64 64" width="160" height="160">
          <rect x="0" y="22" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
          <rect x="0" y="36" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
          <line x1="14" y1="52" x2="50" y2="12" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="12" r="4.5" fill="#C4522A"/>
          <circle cx="14" cy="52" r="4" fill="none" stroke="#E8E2D4" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <div class="test">
      <span class="label">ROTATED</span>
      <div class="box mark-box">
        <svg viewBox="0 0 72 64" width="180" height="160">
          <rect x="26" y="0" width="6" height="64" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
          <rect x="40" y="0" width="6" height="64" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
          <line x1="6" y1="32" x2="66" y2="32" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
          <circle cx="6" cy="32" r="4" fill="none" stroke="#E8E2D4" stroke-width="1.5"/>
          <circle cx="66" cy="32" r="4.5" fill="#C4522A"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- FULL LOCKUP -->
  <span class="section">Full lockup</span>
  <div class="row">
    <div class="test">
      <span class="label">CURRENT — FULL</span>
      <div class="box logo-box">
        <svg viewBox="0 0 260 56" width="260" height="56">
          <g transform="translate(0, 4) scale(0.75)">
            <rect x="0" y="22" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
            <rect x="0" y="36" width="64" height="6" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
            <line x1="14" y1="52" x2="50" y2="12" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
            <circle cx="50" cy="12" r="4.5" fill="#C4522A"/>
            <circle cx="14" cy="52" r="4" fill="none" stroke="#E8E2D4" stroke-width="1.5"/>
          </g>
          <line x1="68" y1="5" x2="68" y2="51" stroke="#464640" stroke-width="1"/>
          <text x="88" y="37" font-family="'DM Serif Display', serif" font-size="38" fill="#E8E2D4">Portage</text>
          <text x="90" y="52" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="4.62" fill="#706A60">WORKS</text>
        </svg>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="test">
      <span class="label">ROTATED — FULL</span>
      <div class="box logo-box">
        <svg viewBox="0 0 270 56" width="270" height="56">
          <g transform="translate(0, 0) scale(0.75)">
            <rect x="26" y="0" width="6" height="72" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
            <rect x="40" y="0" width="6" height="72" rx="3" fill="#E8E2D4" fill-opacity="0.14"/>
            <line x1="6" y1="36" x2="66" y2="36" stroke="#E8E2D4" stroke-width="3" stroke-linecap="round"/>
            <circle cx="6" cy="36" r="4" fill="none" stroke="#E8E2D4" stroke-width="1.5"/>
            <circle cx="66" cy="36" r="4.5" fill="#C4522A"/>
          </g>
          <line x1="72" y1="5" x2="72" y2="51" stroke="#464640" stroke-width="1"/>
          <text x="92" y="37" font-family="'DM Serif Display', serif" font-size="38" fill="#E8E2D4">Portage</text>
          <text x="94" y="52" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="4.62" fill="#706A60">WORKS</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
